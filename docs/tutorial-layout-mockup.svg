<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="arena" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3324"/>
      <stop offset="0.55" stop-color="#10231a"/>
      <stop offset="1" stop-color="#09120e"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1728"/>
      <stop offset="1" stop-color="#080d18"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clipL"><rect x="70" y="160" width="680" height="383" rx="8"/></clipPath>
    <clipPath id="clipR"><rect x="850" y="160" width="680" height="383" rx="8"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="#05070d"/>

  <text x="800" y="44" text-anchor="middle" font-size="30" font-weight="700" fill="#f6dfa0">Обучение: как я тебя понял</text>
  <text x="800" y="74" text-anchor="middle" font-size="15" fill="#8fa3c1">Схема, не точные пиксели. Слева — как сейчас, справа — как надо.</text>

  <!-- ================= LEFT: NOW ================= -->
  <rect x="40" y="100" width="740" height="700" rx="14" fill="url(#panel)" stroke="#4a2626" stroke-width="1.5"/>
  <text x="62" y="134" font-size="19" font-weight="700" fill="#ef7b72">СЕЙЧАС</text>

  <g clip-path="url(#clipL)">
    <rect x="70" y="160" width="680" height="383" fill="url(#arena)"/>
    <ellipse cx="410" cy="400" rx="255" ry="135" fill="#16283a" stroke="#2b4a6a" stroke-width="2"/>
    <ellipse cx="410" cy="400" rx="120" ry="62" fill="#1d3448" stroke="#355a7d" stroke-width="1.5"/>
    <rect x="170" y="250" width="26" height="58" rx="5" fill="#2c3644"/>
    <rect x="610" y="330" width="26" height="58" rx="5" fill="#2c3644"/>
    <rect x="250" y="470" width="26" height="58" rx="5" fill="#2c3644"/>
    <circle cx="430" cy="390" r="12" fill="#d8b07a" opacity="0.85"/>
    <circle cx="530" cy="340" r="12" fill="#9b7bd8" opacity="0.85"/>
  </g>
  <rect x="70" y="160" width="680" height="383" rx="8" fill="none" stroke="#2b3d5e"/>

  <!-- player card -->
  <rect x="85" y="176" width="205" height="42" rx="5" fill="#0b111c" stroke="#c9a45a" stroke-width="1.5"/>
  <rect x="91" y="181" width="32" height="32" rx="3" fill="#25384f" stroke="#7f9fc7"/>
  <circle cx="107" cy="193" r="7" fill="#d8b07a"/>
  <rect x="91" y="210" width="32" height="3" fill="#355a7d"/>
  <text x="130" y="192" font-size="11" fill="#e8eef8">Daroness · Воин</text>
  <rect x="130" y="198" width="148" height="7" rx="3" fill="#1f3a26"/>
  <rect x="130" y="198" width="115" height="7" rx="3" fill="#66d49a"/>
  <text x="130" y="214" font-size="8" fill="#8fa3c1">1050 / 1050</text>

  <!-- skip -->
  <rect x="600" y="176" width="150" height="28" rx="6" fill="#0b111c" stroke="#c9a45a" stroke-width="1.5"/>
  <text x="675" y="195" text-anchor="middle" font-size="10" fill="#f0d79a">Пропустить обучение</text>

  <!-- current strip: middle / bottom-center -->
  <rect x="151" y="448" width="517" height="30" rx="4" fill="#0b111c" stroke="#c9a45a" stroke-width="2"/>
  <text x="410" y="467" text-anchor="middle" font-size="11" fill="#f0d79a">Этап 1/3 · Дуэль: победи тренировочного бота</text>
  <line x1="410" y1="405" x2="410" y2="444" stroke="#ef7b72" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="420" y="421" font-size="10" fill="#ef7b72">сейчас здесь — перекрывает арену</text>
  <defs>
    <marker id="arrowRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#ef7b72"/>
    </marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#66d49a"/>
    </marker>
  </defs>

  <!-- current side hint: wider than card -->
  <rect x="85" y="238" width="420" height="62" rx="6" fill="#0b111c" stroke="#c9a45a" stroke-width="2"/>
  <text x="97" y="260" font-size="11" fill="#f0d79a">Собери 15 монет</text>
  <text x="97" y="278" font-size="9" fill="#8fa3c1">плашка шире карточки и лезет в центр</text>
  <line x1="290" y1="218" x2="290" y2="234" stroke="#ef7b72" stroke-width="2"/>
  <text x="300" y="230" font-size="9" fill="#ef7b72">край карточки</text>

  <!-- pause note -->
  <g>
    <rect x="250" y="500" width="320" height="30" rx="15" fill="#2a1414" stroke="#ef7b72" stroke-width="1.5"/>
    <text x="410" y="520" text-anchor="middle" font-size="11" fill="#ffc4be">пауза / кнопки у подсказок</text>
  </g>

  <!-- left notes -->
  <text x="62" y="590" font-size="13" fill="#ef7b72">✕  полоска в середине/внизу</text>
  <text x="62" y="616" font-size="13" fill="#ef7b72">✕  плашка шире карточки игрока</text>
  <text x="62" y="642" font-size="13" fill="#ef7b72">✕  кнопка/закрытие на подсказке</text>
  <text x="62" y="668" font-size="13" fill="#ef7b72">✕  игра останавливается</text>

  <!-- ================= RIGHT: TARGET ================= -->
  <rect x="820" y="100" width="740" height="700" rx="14" fill="url(#panel)" stroke="#1f4a2e" stroke-width="1.5"/>
  <text x="842" y="134" font-size="19" font-weight="700" fill="#66d49a">НАДО</text>

  <g clip-path="url(#clipR)">
    <rect x="850" y="160" width="680" height="383" fill="url(#arena)"/>
    <ellipse cx="1190" cy="400" rx="255" ry="135" fill="#16283a" stroke="#2b4a6a" stroke-width="2"/>
    <ellipse cx="1190" cy="400" rx="120" ry="62" fill="#1d3448" stroke="#355a7d" stroke-width="1.5"/>
    <rect x="950" y="250" width="26" height="58" rx="5" fill="#2c3644"/>
    <rect x="1390" y="330" width="26" height="58" rx="5" fill="#2c3644"/>
    <rect x="1030" y="470" width="26" height="58" rx="5" fill="#2c3644"/>
    <circle cx="1210" cy="390" r="12" fill="#d8b07a" opacity="0.85"/>
    <circle cx="1310" cy="340" r="12" fill="#9b7bd8" opacity="0.85"/>
  </g>
  <rect x="850" y="160" width="680" height="383" rx="8" fill="none" stroke="#2b3d5e"/>

  <!-- player card -->
  <rect x="865" y="176" width="205" height="42" rx="5" fill="#0b111c" stroke="#c9a45a" stroke-width="1.5"/>
  <rect x="871" y="181" width="32" height="32" rx="3" fill="#25384f" stroke="#7f9fc7"/>
  <circle cx="887" cy="193" r="7" fill="#d8b07a"/>
  <rect x="871" y="210" width="32" height="3" fill="#355a7d"/>
  <text x="910" y="192" font-size="11" fill="#e8eef8">Daroness · Воин</text>
  <rect x="910" y="198" width="148" height="7" rx="3" fill="#1f3a26"/>
  <rect x="910" y="198" width="115" height="7" rx="3" fill="#66d49a"/>
  <text x="910" y="214" font-size="8" fill="#8fa3c1">1050 / 1050</text>

  <!-- skip -->
  <rect x="1380" y="176" width="150" height="28" rx="6" fill="#0b111c" stroke="#c9a45a" stroke-width="1.5"/>
  <text x="1455" y="195" text-anchor="middle" font-size="10" fill="#f0d79a">Пропустить обучение</text>

  <!-- target strip: top center, same level as skip -->
  <rect x="1076" y="176" width="296" height="30" rx="4" fill="#0b111c" stroke="#66d49a" stroke-width="2"/>
  <text x="1224" y="190" text-anchor="middle" font-size="9" fill="#f0d79a">Этап 1/3 · Дуэль:</text>
  <text x="1224" y="201" text-anchor="middle" font-size="9" fill="#f0d79a">победи тренировочного бота</text>
  <line x1="1224" y1="146" x2="1224" y2="172" stroke="#66d49a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="1234" y="160" font-size="10" fill="#66d49a">у самого верха, по центру</text>

  <!-- target side hint: under card, same width, no button -->
  <rect x="865" y="226" width="205" height="52" rx="6" fill="#0b111c" stroke="#66d49a" stroke-width="2"/>
  <text x="877" y="248" font-size="11" fill="#f0d79a">Собери 15 монет</text>
  <text x="877" y="265" font-size="9" fill="#8fa3c1">ровно под карточкой, без кнопок</text>
  <line x1="1075" y1="200" x2="1075" y2="222" stroke="#66d49a" stroke-width="1.5"/>
  <line x1="865" y1="200" x2="865" y2="222" stroke="#66d49a" stroke-width="1.5"/>
  <text x="1090" y="218" font-size="9" fill="#66d49a">ширина = карточке</text>

  <!-- game continues -->
  <g>
    <circle cx="880" cy="310" r="12" fill="#12251a" stroke="#66d49a"/>
    <path d="M876,303 L887,310 L876,317 Z" fill="#66d49a"/>
    <text x="900" y="314" font-size="11" fill="#bfe8d2">игра идёт, без паузы</text>
  </g>

  <!-- right notes -->
  <text x="842" y="590" font-size="13" fill="#66d49a">✓  полоска у верхнего края, по центру</text>
  <text x="842" y="616" font-size="13" fill="#66d49a">✓  на одном уровне с «Пропустить»</text>
  <text x="842" y="642" font-size="13" fill="#66d49a">✓  плашки под аватаркой, ширина карточки</text>
  <text x="842" y="668" font-size="13" fill="#66d49a">✓  без кнопок у подсказок, игра без паузы</text>

  <text x="800" y="842" text-anchor="middle" font-size="12" fill="#7f8ea8">Золотая рамка — подсказка/плашка. Зелёный — как надо. Красный — что мешает сейчас.</text>
  <text x="800" y="866" text-anchor="middle" font-size="12" fill="#7f8ea8">Если так — передаю агенту как ТЗ: полоска сверху, плашки под аватаркой, без кнопок и пауз.</text>
</svg>
